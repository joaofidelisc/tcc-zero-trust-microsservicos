services:
  service_a:
    build: ./service_a
    init: true
    ports:
      - "5000:5000"
    environment:
      INVENTORY_URL: http://service_b:5000/internal/reserve-stock
    depends_on:
      service_b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]
  service_b:
    build: ./service_b
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]
networks:
  internal:
    driver: bridge
